<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 376" width="680" height="376" role="img" aria-labelledby="aoi-light-title aoi-light-desc">
  <title id="aoi-light-title">Training mode에서 AOTAutograd의 개입</title>
  <desc id="aoi-light-desc">Dynamo가 만든 FX Graph는 backend compiler로 곧바로 전달되지 않고, AOTAutograd가 중간에 개입하여 joint graph를 만들고 forward와 backward로 분리한 뒤에야 backend compiler를 거쳐 torch.autograd.Function이 만들어진다.</desc>
  <defs>
    <marker id="aoi-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8A8078" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="aoi-arr-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9A7B68" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="376" fill="#FFFFFF"/>

  <!-- ══ Arrows ══ -->
  <!-- nn.Module → Dynamo -->
  <path d="M148 72 H192" fill="none" stroke="#8A8078" stroke-width="1.2" marker-end="url(#aoi-arr)"/>

  <!-- Blocked direct path: Dynamo → backend compiler (dashed + ✗) -->
  <path d="M308 72 H464" fill="none" stroke="#B8B0A8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#aoi-arr)"/>
  <rect x="376" y="60" width="24" height="24" rx="2" fill="#FFFFFF"/>
  <text x="388" y="73" font-family="'DM Mono', monospace" font-size="15" font-weight="600" fill="#9A7B68" text-anchor="middle" dominant-baseline="middle">✗</text>
  <rect x="324" y="88" width="128" height="30" rx="2" fill="#FFFFFF"/>
  <text x="388" y="98" font-family="'DM Mono', monospace" font-size="8.5" fill="#8A8078" text-anchor="middle">training: 직행 불가</text>
  <text x="388" y="112" font-family="'DM Mono', monospace" font-size="8.5" fill="#8A8078" text-anchor="middle">(inference는 직행 가능)</text>

  <!-- Real path: Dynamo ↓ → AOTAutograd -->
  <path d="M252 96 V184 Q252 192 260 192 H276" fill="none" stroke="#9A7B68" stroke-width="1.4" marker-end="url(#aoi-arr-warm)"/>
  <rect x="168" y="132" width="72" height="14" rx="2" fill="#FFFFFF"/>
  <text x="236" y="142" font-family="'DM Mono', monospace" font-size="8.5" fill="#9A7B68" text-anchor="end" letter-spacing="0.5">FX GRAPH</text>

  <!-- AOTAutograd → backend compiler -->
  <path d="M496 192 H548 Q556 192 556 184 V100" fill="none" stroke="#9A7B68" stroke-width="1.4" marker-end="url(#aoi-arr-warm)"/>
  <rect x="452" y="132" width="96" height="14" rx="2" fill="#FFFFFF"/>
  <text x="544" y="142" font-family="'DM Mono', monospace" font-size="8.5" fill="#9A7B68" letter-spacing="0.5" text-anchor="end">FWD/BWD 그래프</text>

  <!-- backend compiler → torch.autograd.Function -->
  <path d="M588 96 V264" fill="none" stroke="#8A8078" stroke-width="1.2" marker-end="url(#aoi-arr)"/>

  <!-- ══ Node boxes ══ -->
  <!-- nn.Module -->
  <rect x="36" y="48" width="112" height="48" rx="8" fill="#FAF8F5" stroke="#C4BAAE" stroke-width="1"/>
  <text x="92" y="74" font-family="'DM Mono', monospace" font-size="11" font-weight="500" fill="#141210" text-anchor="middle" dominant-baseline="middle">nn.Module</text>

  <!-- Dynamo -->
  <rect x="196" y="48" width="112" height="48" rx="8" fill="#F5F8FF" stroke="#C7D8F8" stroke-width="1"/>
  <text x="252" y="74" font-family="'DM Mono', monospace" font-size="12" font-weight="500" fill="#141210" text-anchor="middle" dominant-baseline="middle">Dynamo</text>

  <!-- backend compiler -->
  <rect x="468" y="48" width="176" height="48" rx="8" fill="#FAF8F5" stroke="#C4BAAE" stroke-width="1"/>
  <text x="556" y="66" font-family="'DM Mono', monospace" font-size="12" font-weight="500" fill="#141210" text-anchor="middle" dominant-baseline="middle">backend compiler</text>
  <text x="556" y="82" font-family="'DM Mono', monospace" font-size="9" fill="#8A8078" text-anchor="middle" dominant-baseline="middle">예: Inductor</text>

  <!-- AOTAutograd (focal) -->
  <rect x="280" y="160" width="216" height="64" rx="8" fill="#FBF4EC" stroke="#9A7B68" stroke-width="1.4"/>
  <text x="388" y="184" font-family="'DM Mono', monospace" font-size="14" font-weight="600" fill="#141210" text-anchor="middle" dominant-baseline="middle">AOTAutograd</text>
  <text x="388" y="204" font-family="'DM Mono', monospace" font-size="9" fill="#9A7B68" text-anchor="middle" dominant-baseline="middle">joint graph 생성 → forward/backward 분리</text>

  <!-- torch.autograd.Function -->
  <rect x="436" y="268" width="208" height="64" rx="8" fill="#FAF8F5" stroke="#C4BAAE" stroke-width="1"/>
  <text x="540" y="292" font-family="'DM Mono', monospace" font-size="11" font-weight="500" fill="#141210" text-anchor="middle" dominant-baseline="middle">torch.autograd.Function</text>
  <text x="540" y="310" font-family="'DM Mono', monospace" font-size="9" fill="#8A8078" text-anchor="middle" dominant-baseline="middle">compiled forward + backward</text>
</svg>
