<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 484" width="680" height="484" role="img" aria-labelledby="ctf-light-title ctf-light-desc">
  <title id="ctf-light-title">torch.compile 학습 시 forward/backward 흐름</title>
  <desc id="ctf-light-desc">사용자 코드 세 줄이 실행될 때 내부 동작: 첫 호출에서 Dynamo와 AOTAutograd가 compiled forward와 backward를 가진 torch.autograd.Function을 생성하고, forward 실행 결과에 backward가 grad_fn으로 등록되었다가 loss.backward() 시점에 실행되어 gradient를 계산한다.</desc>
  <defs>
    <marker id="ctf-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8A8078" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ctf-arr-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9A7B68" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="484" fill="#FFFFFF"/>

  <!-- ══ Zone: torch.autograd.Function (painted first) ══ -->
  <rect x="356" y="120" width="288" height="224" rx="10" fill="#FBFAF8" stroke="#4A3E38" stroke-width="1.2"/>
  <text x="380" y="144" font-family="'DM Mono', monospace" font-size="9.5" font-weight="500" letter-spacing="1.5" fill="#4A3E38">TORCH.AUTOGRAD.FUNCTION</text>
  <text x="380" y="160" font-family="'DM Mono', monospace" font-size="9" fill="#8A8078">forward + backward를 가진 하나의 custom Op</text>

  <!-- ══ Arrows (behind node boxes) ══ -->
  <!-- a. [1] → compile chip (첫 호출) -->
  <path d="M284 76 H336 Q344 76 344 68 V66 Q344 58 352 58 H374" fill="none" stroke="#8A8078" stroke-width="1.2" marker-end="url(#ctf-arr)"/>
  <rect x="288" y="58" width="44" height="12" rx="2" fill="#FFFFFF"/>
  <text x="310" y="67" font-family="'DM Mono', monospace" font-size="8.5" fill="#8A8078" text-anchor="middle">첫 호출</text>

  <!-- b. compile chip → Function 생성 (dashed) -->
  <path d="M512 80 V114" fill="none" stroke="#8A8078" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ctf-arr)"/>
  <rect x="520" y="88" width="32" height="12" rx="2" fill="#FFFFFF"/>
  <text x="536" y="97" font-family="'DM Mono', monospace" font-size="8.5" fill="#8A8078" text-anchor="middle">생성</text>

  <!-- c. [1] → compiled forward 실행 -->
  <path d="M284 96 H332 Q340 96 340 104 V194 Q340 202 348 202 H376" fill="none" stroke="#8A8078" stroke-width="1.2" marker-end="url(#ctf-arr)"/>
  <rect x="266" y="142" width="66" height="14" rx="2" fill="#FFFFFF"/>
  <text x="330" y="152" font-family="'DM Mono', monospace" font-size="8.5" fill="#8A8078" text-anchor="end">forward 실행</text>

  <!-- d2. forward → backward : grad_fn 등록 (dashed, inside zone) -->
  <path d="M500 228 V258" fill="none" stroke="#8A8078" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ctf-arr)"/>
  <rect x="508" y="236" width="80" height="14" rx="2" fill="#FBFAF8"/>
  <text x="512" y="246" font-family="'DM Mono', monospace" font-size="8.5" fill="#8A8078">grad_fn 등록</text>

  <!-- e. [2] → compiled backward : grad_fn 연결 (dashed) -->
  <path d="M284 280 H344 Q352 280 352 288 V288 Q352 296 360 296 H376" fill="none" stroke="#8A8078" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ctf-arr)"/>
  <rect x="292" y="262" width="48" height="12" rx="2" fill="#FFFFFF"/>
  <text x="316" y="271" font-family="'DM Mono', monospace" font-size="8.5" fill="#8A8078" text-anchor="middle" letter-spacing="0.5">GRAD_FN</text>

  <!-- f. [3] → compiled backward 실행 (warm accent) -->
  <path d="M284 380 H332 Q340 380 340 372 V316 Q340 308 348 308 H376" fill="none" stroke="#9A7B68" stroke-width="1.4" marker-end="url(#ctf-arr-warm)"/>
  <rect x="288" y="388" width="74" height="14" rx="2" fill="#FFFFFF"/>
  <text x="325" y="398" font-family="'DM Mono', monospace" font-size="8.5" fill="#9A7B68" text-anchor="middle">backward 실행</text>

  <!-- g. compiled backward → gradients -->
  <path d="M500 316 V398" fill="none" stroke="#8A8078" stroke-width="1.2" marker-end="url(#ctf-arr)"/>

  <!-- ══ Node boxes ══ -->
  <!-- Code [1] -->
  <rect x="36" y="60" width="248" height="56" rx="8" fill="#FAF8F5" stroke="#C4BAAE" stroke-width="1"/>
  <rect x="48" y="52" width="24" height="16" rx="2" fill="#FFFFFF" stroke="#AFA69B" stroke-width="0.8"/>
  <text x="60" y="63.5" font-family="'Pretendard', sans-serif" font-size="9.5" font-weight="600" fill="#8A8078" text-anchor="middle">[1]</text>
  <text x="160" y="92" font-family="'DM Mono', monospace" font-size="9.5" font-weight="500" fill="#141210" text-anchor="middle" dominant-baseline="middle">outputs = compiled_model(images)</text>

  <!-- Code [2] -->
  <rect x="36" y="232" width="248" height="56" rx="8" fill="#FAF8F5" stroke="#C4BAAE" stroke-width="1"/>
  <rect x="48" y="224" width="24" height="16" rx="2" fill="#FFFFFF" stroke="#AFA69B" stroke-width="0.8"/>
  <text x="60" y="235.5" font-family="'Pretendard', sans-serif" font-size="9.5" font-weight="600" fill="#8A8078" text-anchor="middle">[2]</text>
  <text x="160" y="264" font-family="'DM Mono', monospace" font-size="9" font-weight="500" fill="#141210" text-anchor="middle" dominant-baseline="middle">loss = F.cross_entropy(outputs, labels)</text>

  <!-- Code [3] -->
  <rect x="36" y="356" width="248" height="56" rx="8" fill="#FAF8F5" stroke="#C4BAAE" stroke-width="1"/>
  <rect x="48" y="348" width="24" height="16" rx="2" fill="#FFFFFF" stroke="#AFA69B" stroke-width="0.8"/>
  <text x="60" y="359.5" font-family="'Pretendard', sans-serif" font-size="9.5" font-weight="600" fill="#8A8078" text-anchor="middle">[3]</text>
  <text x="160" y="388" font-family="'DM Mono', monospace" font-size="9.5" font-weight="500" fill="#141210" text-anchor="middle" dominant-baseline="middle">loss.backward()</text>

  <!-- Compile chip -->
  <rect x="380" y="36" width="264" height="44" rx="8" fill="#FFFFFF" stroke="#B8B0A8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="512" y="53" font-family="'DM Mono', monospace" font-size="10.5" font-weight="500" fill="#141210" text-anchor="middle" dominant-baseline="middle">Dynamo tracing → AOTAutograd</text>
  <text x="512" y="68" font-family="'DM Mono', monospace" font-size="9" fill="#8A8078" text-anchor="middle" dominant-baseline="middle">첫 호출 시 1회 컴파일</text>

  <!-- compiled forward -->
  <rect x="380" y="176" width="240" height="52" rx="8" fill="#F5F8FF" stroke="#C7D8F8" stroke-width="1"/>
  <text x="396" y="196" font-family="'DM Mono', monospace" font-size="8.5" font-weight="500" letter-spacing="1.2" fill="#4A7FD4">FWD</text>
  <text x="500" y="200" font-family="'DM Mono', monospace" font-size="13" font-weight="500" fill="#141210" text-anchor="middle" dominant-baseline="middle">compiled forward</text>
  <text x="500" y="216" font-family="'DM Mono', monospace" font-size="9" fill="#8A8078" text-anchor="middle" dominant-baseline="middle">→ outputs 반환</text>

  <!-- compiled backward -->
  <rect x="380" y="264" width="240" height="52" rx="8" fill="#FBF4EC" stroke="#E5D5C5" stroke-width="1"/>
  <text x="396" y="284" font-family="'DM Mono', monospace" font-size="8.5" font-weight="500" letter-spacing="1.2" fill="#9A7B68">BWD</text>
  <text x="500" y="296" font-family="'DM Mono', monospace" font-size="13" font-weight="500" fill="#141210" text-anchor="middle" dominant-baseline="middle">compiled backward</text>

  <!-- gradients -->
  <rect x="380" y="404" width="240" height="44" rx="8" fill="#FAF8F5" stroke="#D8D2CA" stroke-width="1"/>
  <text x="500" y="421" font-family="'DM Mono', monospace" font-size="11" font-weight="500" fill="#141210" text-anchor="middle" dominant-baseline="middle">model weight gradients</text>
  <text x="500" y="437" font-family="'DM Mono', monospace" font-size="9" fill="#8A8078" text-anchor="middle" dominant-baseline="middle">w.grad 저장 → optimizer가 사용</text>
</svg>
